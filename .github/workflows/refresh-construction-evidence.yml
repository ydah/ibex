name: Refresh construction evidence
on:
  push:
    branches: [dependabot/github_actions/github-actions-c3a7c78b80]
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BUNDLE_WITHOUT: types:docs:mutation:profile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec ruby tool/construction_profile.rb --wall-seconds=60 --output=tool/profile/evidence/construction-profile-v1.json
      - run: bundle exec rake quality:construction_profile
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: construction-evidence
          path: tool/profile/evidence/construction-profile-v1.json
          retention-days: 1
