name: CI

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

  schedule:
    - cron: '27 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    env:
      BUNDLE_GEMFILE: gemfiles/compat.Gemfile
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: '3.0'
            experimental: false
          - ruby: '3.1'
            experimental: false
          - ruby: '3.2'
            experimental: false
          - ruby: '3.3'
            experimental: false
          - ruby: '3.4'
            experimental: false
          - ruby: '4.0'
            experimental: false
          - ruby: 'head'
            experimental: false
          - ruby: jruby
            experimental: true
          - ruby: truffleruby
            experimental: true
    continue-on-error: ${{ matrix.experimental }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Construction profile provenance requires repository history.
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the default task
        run: bundle exec rake

  frozen-strings:
    runs-on: ubuntu-latest
    name: Frozen string literals
    env:
      BUNDLE_WITHOUT: types:docs:mutation:profile
      RUBYOPT: --enable-frozen-string-literal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Construction profile provenance requires repository history.
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Run tests with global frozen string literals
        run: bundle exec rake test

  grammar-tests:
    runs-on: ubuntu-latest
    name: Grammar-declared tests
    env:
      BUNDLE_WITHOUT: types:docs:mutation:profile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Run grammar-declared tests
        run: bundle exec rake grammar:test
      - name: Verify error UX evidence
        run: bundle exec rake quality:error_ux

  stage-a-safety:
    runs-on: ubuntu-latest
    name: Stage A safety net
    env:
      BUNDLE_WITHOUT: types:docs:mutation:profile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Verify deterministic safety gates
        run: |
          bundle exec rake test:matrix
          bundle exec rake test:zero_cost
          bundle exec rake test:reproducible
          bundle exec rake test:compat
          bundle exec rake test:ir_schema
          bundle exec rake test:no_exec
          bundle exec rake test:adversarial
          bundle exec rake gallery:build
          bundle exec rake gallery:conflicts
          bundle exec rake fuzz:short
          bundle exec rake fuzz:direct
          bundle exec rake fuzz:injection
          bundle exec rake deps:zero
          bundle exec rake network:zero
      - name: Run scheduled exhaustive gates
        if: github.event_name == 'schedule'
        env:
          IBEX_ADVERSARIAL_FULL: '1'
        run: |
          bundle exec rake test:matrix:full
          bundle exec rake test:adversarial
          bundle exec rake fuzz:long

  independent-verification:
    runs-on: ubuntu-latest
    name: Independent table verification
    env:
      BUNDLE_WITHOUT: types:docs:mutation:profile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Verify gallery automata and mutation sensitivity
        run: |
          bundle exec rake verify
          bundle exec rake verify:injection
          bundle exec rake equiv:regression
          bundle exec rake analysis:test
          bundle exec rake fix:test
      - name: Run strict verification
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: bundle exec rake verify:strict

  v1-contracts:
    runs-on: ubuntu-latest
    name: v1 contract coverage
    env:
      BUNDLE_WITHOUT: types:docs:mutation:profile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Workload evidence requires repository history.
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Verify maturity, documentation, and localization contracts
        run: |
          bundle exec rake test:docs_coverage
          bundle exec rake quality:comparative_claims
          bundle exec rake quality:error_ux_review_kit
          bundle exec rake quality:workloads
          bundle exec rake quality:direct_ielr_decision
          bundle exec rake quality:maturity
          bundle exec rake quality:configuration_inventory
          bundle exec rake i18n:coverage
          bundle exec rake bison:test
          bundle exec rake release:reproducible
      - name: Verify pinned external grammar imports
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          bison --version
          bundle exec rake bison:external

  runtime-abi-assessment:
    runs-on: ubuntu-latest
    name: Runtime ABI assessment
    permissions:
      contents: read
    env:
      BUNDLE_WITHOUT: types:docs:mutation:profile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Enforce pull-request runtime ABI assessment
        if: github.event_name == 'pull_request'
        run: bundle exec rake quality:runtime_abi_pr

  rbs:
    runs-on: ubuntu-latest
    name: RBS and Steep
    env:
      BUNDLE_WITHOUT: docs:mutation:profile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Check generated RBS signatures
        run: |
          ruby -rfileutils -e '
            output = File.join(ENV.fetch("RUNNER_TEMP"), "ibex-signatures")
            FileUtils.rm_rf(output)
            sources = Dir.glob("lib/**/*.rb").sort
            abort "no Ruby sources found" if sources.empty?
            command = ["bundle", "exec", "rbs-inline", "--opt-out", "--base=lib", "--output=#{output}", *sources]
            abort "RBS generation failed" unless system(*command)
          '
          diff -ru sig "$RUNNER_TEMP/ibex-signatures"
      - name: Validate RBS signatures
        run: bundle exec rbs -r digest -r fileutils -r json -r optparse -r tempfile -r timeout -r tmpdir -r uri -I sig validate
      - name: Type check Ruby implementation
        run: bundle exec steep check
      - name: Check documented type statistics
        run: bundle exec ruby tool/type_stats.rb --check

  mutation:
    runs-on: ubuntu-latest
    name: Bounded mutation testing
    timeout-minutes: 10
    env:
      BUNDLE_WITHOUT: types:docs:profile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Mutate compact table construction
        run: bundle exec rake quality:mutation

  site:
    runs-on: ubuntu-latest
    name: Browser site
    env:
      BUNDLE_WITHOUT: types:mutation:profile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install browser dependencies
        run: npm ci
      - name: Build and test the project site
        run: npm run test:site
      - name: Build API documentation
        run: |
          bundle exec yard doc
          test -s tmp/site/api/index.html

  benchmark:
    runs-on: ubuntu-latest
    name: Benchmark artifact
    env:
      BUNDLE_WITHOUT: types:docs:mutation:profile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Validate schema and reproduce deterministic structure
        run: bundle exec ruby benchmark/verify.rb benchmark/results/v2/2026-08-10-cbb20aa9897a-ruby-4.0.0-arm64-darwin24.json
      - name: Record full observational benchmark
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          BENCHMARK_OUTPUT: benchmark-output/ibex-benchmark-${{ github.sha }}-ruby-3.4-${{ runner.os }}-${{ runner.arch }}.json
        run: bundle exec ruby benchmark/pipeline.rb --iterations 3 --runtime-iterations 1000 --seed 12345 --output "$BENCHMARK_OUTPUT"
      - name: Preserve full observational benchmark
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ibex-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark-output/*.json
          if-no-files-found: error
          retention-days: 30

  actionlint:
    runs-on: ubuntu-latest
    name: actionlint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check GitHub Actions workflows
        uses: docker://rhysd/actionlint@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7
        with:
          args: -color

  zizmor:
    runs-on: ubuntu-latest
    name: zizmor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit GitHub Actions workflows
        uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
        with:
          advanced-security: false
          version: 1.27.0
