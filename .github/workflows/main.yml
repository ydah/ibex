name: CI

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

  schedule:
    - cron: '27 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: '3.0'
            experimental: false
          - ruby: '3.1'
            experimental: false
          - ruby: '3.2'
            experimental: false
          - ruby: '3.3'
            experimental: false
          - ruby: '3.4'
            experimental: false
          - ruby: '4.0'
            experimental: false
          - ruby: 'head'
            experimental: false
          - ruby: jruby
            experimental: true
          - ruby: truffleruby
            experimental: true
    continue-on-error: ${{ matrix.experimental }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@a30dfa457ad68707b8b910ac3a244714b61c0626 # v1.320.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the default task
        run: bundle exec rake

  frozen-strings:
    runs-on: ubuntu-latest
    name: Frozen string literals
    env:
      RUBYOPT: --enable-frozen-string-literal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@a30dfa457ad68707b8b910ac3a244714b61c0626 # v1.320.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Run tests with global frozen string literals
        run: bundle exec rake test

  grammar-tests:
    runs-on: ubuntu-latest
    name: Grammar-declared tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@a30dfa457ad68707b8b910ac3a244714b61c0626 # v1.320.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Run grammar-declared tests
        run: bundle exec rake grammar:test
      - name: Verify error UX evidence
        run: bundle exec rake quality:error_ux

  rbs:
    runs-on: ubuntu-latest
    name: RBS and Steep
    env:
      BUNDLE_GEMFILE: gemfiles/Gemfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@a30dfa457ad68707b8b910ac3a244714b61c0626 # v1.320.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Check generated RBS signatures
        run: |
          ruby -rfileutils -e '
            output = File.join(ENV.fetch("RUNNER_TEMP"), "ibex-signatures")
            FileUtils.rm_rf(output)
            sources = Dir.glob("lib/**/*.rb").sort
            abort "no Ruby sources found" if sources.empty?
            command = ["bundle", "exec", "rbs-inline", "--opt-out", "--base=lib", "--output=#{output}", *sources]
            abort "RBS generation failed" unless system(*command)
          '
          diff -ru sig "$RUNNER_TEMP/ibex-signatures"
      - name: Validate RBS signatures
        run: bundle exec rbs -r digest -r json -r optparse -r tempfile -r timeout -r tmpdir -r uri -I sig validate
      - name: Type check Ruby implementation
        run: bundle exec steep check
      - name: Check documented type statistics
        run: bundle exec ruby tool/type_stats.rb --check

  mutation:
    runs-on: ubuntu-latest
    name: Bounded mutation testing
    timeout-minutes: 10
    env:
      BUNDLE_GEMFILE: gemfiles/mutation.Gemfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@a30dfa457ad68707b8b910ac3a244714b61c0626 # v1.320.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Mutate compact table construction
        run: bundle exec rake quality:mutation

  site:
    runs-on: ubuntu-latest
    name: Browser site
    env:
      BUNDLE_GEMFILE: gemfiles/docs.Gemfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@a30dfa457ad68707b8b910ac3a244714b61c0626 # v1.320.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install browser dependencies
        run: npm ci
      - name: Build and test the project site
        run: npm run test:site
      - name: Build API documentation
        run: |
          bundle exec yard doc
          test -s tmp/site/api/index.html

  benchmark:
    runs-on: ubuntu-latest
    name: Benchmark artifact
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@a30dfa457ad68707b8b910ac3a244714b61c0626 # v1.320.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Validate schema and reproduce deterministic structure
        run: bundle exec ruby benchmark/verify.rb benchmark/results/v2/2026-07-26-78d3abb5a29e-ruby-4.0.0-arm64-darwin24.json
      - name: Record full observational benchmark
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          BENCHMARK_OUTPUT: benchmark-output/ibex-benchmark-${{ github.sha }}-ruby-3.4-${{ runner.os }}-${{ runner.arch }}.json
        run: bundle exec ruby benchmark/pipeline.rb --iterations 3 --runtime-iterations 1000 --seed 12345 --output "$BENCHMARK_OUTPUT"
      - name: Preserve full observational benchmark
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ibex-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark-output/*.json
          if-no-files-found: error
          retention-days: 30

  actionlint:
    runs-on: ubuntu-latest
    name: actionlint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check GitHub Actions workflows
        uses: docker://rhysd/actionlint@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7
        with:
          args: -color

  zizmor:
    runs-on: ubuntu-latest
    name: zizmor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit GitHub Actions workflows
        uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
        with:
          advanced-security: false
          version: 1.27.0
