# Increment contract_revision and update both documents whenever a Stable
# contract changes. The coverage gate rejects a one-sided revision update.
version: 2
features:
  compatible-parser:
    contract_revision: 1
    en: docs/grammar-reference.md
    ja: docs/ja/stable-api.md
  versioned-ir:
    contract_revision: 1
    en: docs/architecture.md
    ja: docs/ja/stable-api.md
  batch-cst:
    contract_revision: 1
    en: docs/cst.md
    ja: docs/ja/stable-api.md
  compatibility-policy:
    contract_revision: 1
    en: docs/stability.md
    ja: docs/ja/stable-api.md
