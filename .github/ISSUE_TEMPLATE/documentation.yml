name: Documentation issue
description: Report unclear, missing, or stale documentation.
title: "[docs] "
labels: [documentation]
body:
  - type: input
    id: location
    attributes:
      label: Page or path
      placeholder: "https://ydah.github.io/ibex/docs/..."
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Suggested improvement
