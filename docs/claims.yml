claims:
  - id: racc-error-ux-json-v1
    state: review_pending
    title: JSON error callback and bounded-repair observations against Racc 1.8.1
    wording: >-
      On ten fixed malformed JSON inputs, the committed snapshot records Ibex diagnostics,
      Racc's public on_error callback values, and a maintainer assessment of ten bounded repairs.
    publication:
      path: docs/error-ux.md
      marker: racc-error-ux-json-v1
    subjects:
      - tool: ibex
        version: 0.1.0
        revision: cc20c5eb799cc218ebea665df64261f10d030f75
      - tool: racc
        version: 1.8.1
        revision: not_applicable
    public_command:
      - bundle exec ruby tool/error_ux_snapshot.rb
    corpus:
      - id: json-error-cases-v1
        path: test/fixtures/error_ux/json-errors-v1.json
        revision: cc20c5eb799cc218ebea665df64261f10d030f75
    environment:
      known:
        racc_version: 1.8.1
      unknown:
        - cpu_model
        - kernel_release
        - ruby_engine
        - ruby_platform
        - ruby_version
    unsupported_semantics:
      - The Racc observation is limited to the public on_error callback without an application-specific message layer.
      - The repair usefulness labels are maintainer judgments, not measured Racc recovery behavior.
    subjective_review:
      required: true
      state: pending
      method: A third party reviews all ten case IDs with useful, not useful, unsafe, or unclear labels and rationale.
    validity:
      scope: Exact snapshot introduction revision and Racc 1.8.1 only.
      expires: No comparative UX conclusion may be published before independent review is recorded.
      review_when:
        - Any diagnostic, parser table, Racc version, corpus, or repair policy changes.
        - An independent assessment is added or disagrees with the maintainer assessment.
    evidence:
      - path: docs/error-ux.md
        description: Public method, case table, maintainer assessment, and explicit missing review.
      - path: test/fixtures/error_ux/json-errors-v1.json
        description: Versioned normative observations for all ten inputs.
    limitations:
      - The Ruby, operating system, and processor environment was not recorded in the v1 snapshot.
      - Independent subjective review is still missing, so the 8/10 usefulness assessment is not a completed comparison.
  - id: racc-public-performance-2026-07-31
    state: measured
    title: Fixed-revision public Ruby-backend performance observations against Racc 1.8.1
    wording: >-
      At clean Ibex revision 08c7dc5d939a1f47b0132ae3986818cdbaec1f34, three pinned
      public workloads had slower cold generation and new-instance runtime than Racc 1.8.1's Ruby backend.
    publication:
      path: README.md
      marker: racc-public-performance-2026-07-31
    subjects:
      - tool: ibex
        version: 0.2.0
        revision: 08c7dc5d939a1f47b0132ae3986818cdbaec1f34
      - tool: racc
        version: 1.8.1
        revision: not_applicable
    public_command:
      - bundle exec ruby benchmark/public_comparison.rb
      - --checkout namae=/path/to/namae
      - --checkout bcdice_command=/path/to/bcdice
      - --checkout nokogiri_css=/path/to/nokogiri
      - --runs 10 --warmup 50 --runtime-iterations 250
      - --behavior-probe-iterations 5 --bootstrap-samples 10000
      - --expected-racc-backend ruby --output tmp/public-performance-comparison.json
    corpus:
      - id: bcdice-command
        path: benchmark/public_workloads.json
        revision: 21b4a03789bf2080ad41aaf31299b609ee7bda86
      - id: namae
        path: benchmark/public_workloads.json
        revision: d33875aaf1fc420a8dfe946a3b29cc3e19710061
      - id: nokogiri-css
        path: benchmark/public_workloads.json
        revision: 04a4c29c6a605ad40a78f4ce343ced0832a1805c
    environment:
      known:
        racc_backend: ruby
        ruby_engine: ruby
        ruby_platform: arm64-darwin24
        ruby_version: 4.0.0
        yjit_enabled: "false"
      unknown:
        - cpu_model
        - kernel_release
        - processors
    unsupported_semantics:
      - Only the three pinned Racc-compatible Ruby grammar workloads are covered.
      - Pretokenized parser-core timing is excluded from the public workload comparison.
      - Native Racc, YJIT, other Rubies, other operating systems, and other parser generators are excluded.
    subjective_review:
      required: false
      state: not_applicable
      method: Deterministic statistics and behavior digests are reviewed; no subjective ranking is produced.
    validity:
      scope: Historical observation for the exact Ibex and workload revisions on the recorded environment.
      expires: The historical observation does not expire, but it cannot describe another revision or environment.
      review_when:
        - A current-revision statement is proposed.
        - Any subject version, workload revision, command, environment, or measured lifecycle changes.
    evidence:
      - path: benchmark/README.md
        description: Reproduction command, runtime scope, process isolation, and publication rules.
      - path: benchmark/public_workloads.json
        description: Pinned repositories, grammar paths, and fixed public inputs.
      - path: docs/release-readiness.md
        description: Exact measured revision, environment, ratios, unfavorable rows, and limitations.
    limitations:
      - The committed repository does not contain the complete formal result artifact; the readiness report publishes its reviewed projection.
      - The result is not evidence about the current revision, unmeasured workloads, other backends, or semantic equivalence beyond behavior digests.
