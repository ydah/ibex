name: Release

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to validate and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Restore the main branch for history checks
        run: git switch -C main HEAD

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"

      - name: Install Ruby dependencies
        run: bundle install --jobs 4 --retry 3

      - name: Verify release version and quality gates
        run: |
          ruby - <<'RUBY'
          require_relative "lib/ibex/version"
          require_relative "lib/ibex/runtime/version"

          tag = ENV.fetch("RELEASE_TAG")
          abort "release tag must match vMAJOR.MINOR.PATCH" unless tag.match?(/\Av\d+\.\d+\.\d+\z/)

          expected = tag.delete_prefix("v")
          versions = [Ibex::VERSION, Ibex::Runtime::VERSION]
          abort "release tag #{tag} does not match package versions #{versions.inspect}" unless versions.all? do |version|
            version == expected
          end
          RUBY
          bundle exec rake
          bundle exec rake release:reproducible

      - name: Build release packages
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          gem build ibex-runtime.gemspec --output "dist/ibex-runtime-${version}.gem"
          gem build ibex.gemspec --output "dist/ibex-${version}.gem"
          (cd dist && sha256sum -- *.gem > SHA256SUMS)

      - name: Configure RubyGems trusted publishing
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish packages to RubyGems
        run: |
          version="${RELEASE_TAG#v}"

          publish_gem() {
            local gem_name="$1"
            local gem_path="$2"
            local scratch

            scratch="$(mktemp -d)"
            if (
              cd "$scratch"
              gem fetch \
                --clear-sources \
                --source https://rubygems.org \
                --version "$version" \
                "$gem_name" >/dev/null 2>&1
            ); then
              if ! cmp -s "$gem_path" "$scratch/${gem_name}-${version}.gem"; then
                echo "RubyGems already contains ${gem_name} ${version} with different bytes" >&2
                return 1
              fi
              echo "RubyGems already contains ${gem_name} ${version}; verified identical bytes"
            else
              gem push "$gem_path"
            fi
          }

          publish_gem "ibex-runtime" "dist/ibex-runtime-${version}.gem"
          publish_gem "ibex" "dist/ibex-${version}.gem"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.gem dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.gem dist/SHA256SUMS \
              --verify-tag \
              --title "Ibex ${version}" \
              --generate-notes
          fi
