    unsupported_semantics:
      - Only the three pinned Racc-compatible Ruby grammar workloads are covered.
      - Pretokenized parser-core timing is excluded from the public workload comparison.
      - Native Racc, YJIT, other Rubies, other operating systems, and other parser generators are excluded.
    subjective_review:
      required: false
      state: not_applicable
      method: Deterministic statistics and behavior digests are reviewed; no cross-category ordering is produced.
    validity:
      scope: Exact Ibex revision, pinned workload revisions, Ruby 4.0.0 arm64-darwin24 environment, and Racc 1.8.1 Ruby backend.
      expires: Review whenever a subject version, workload revision, command, environment, or measured lifecycle changes.
