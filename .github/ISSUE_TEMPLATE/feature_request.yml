name: Feature request
description: Propose a focused improvement to Ibex.
title: "[feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What task is blocked or unnecessarily difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest coherent API or documentation change.
    validations:
      required: true
  - type: dropdown
    id: ownership
    attributes:
      label: Configuration ownership
      description: Where should the setting live?
      options:
        - Grammar-owned declaration
        - Invocation-owned CLI or API option
        - Documentation or tooling only
    validations:
      required: true
  - type: textarea
    id: maturity
    attributes:
      label: Compatibility and maturity impact
      description: Explain Stable, Preview, or Experimental impact and migration needs.
    validations:
      required: true
